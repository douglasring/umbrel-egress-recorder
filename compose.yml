# Umbrel Egress Recorder — Portainer stack
#
# Deploy as a Portainer stack on the Umbrel host. No web interface is exposed.
#
# The image is pinned by digest below. A mutable :latest tag, auto-pulled by a
# container holding NET_RAW in the host network namespace, is the highest-leverage
# compromise path in this design, so update the digest deliberately.
#
# Deliberately avoids constructs the Portainer stack editor rejects: no `version:`
# key, no Docker-CLI-only tmpfs option syntax, and no quoted `cpus`.

services:
  egress-recorder:
    image: ghcr.io/douglasring/umbrel-egress-recorder@sha256:e8ae9c39adc9c0da304410b9ba4d255e5475c747cf0744c6d9ecf4144eeabcde
    container_name: umbrel-egress-recorder
    network_mode: host
    restart: unless-stopped

    # NET_RAW is the minimum for packet capture. It is also not passive: in the
    # host network namespace it permits packet injection. See README, "Residual risk".
    #
    # SETUID/SETGID are required, not optional. Debian/Ubuntu tcpdump is built
    # --with-user=tcpdump and always drops privileges at startup; droproot() runs even
    # when the target user is root, so it cannot be turned off with -Z. Without these
    # two capabilities tcpdump exits immediately with EPERM and nothing is captured.
    #
    # Since they are required anyway, the recorder uses "-Z nobody" so tcpdump really
    # does end up unprivileged after opening the capture socket.
    #
    # Do NOT add `user:` here — Docker does not set ambient capabilities, so a non-root
    # process gets CapPrm=0 and AF_PACKET fails with EPERM.
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - SETUID
      - SETGID

    security_opt:
      - no-new-privileges:true

    read_only: true

    # Python as PID 1 ignores SIGTERM, so `docker stop` would hang for the full
    # grace period and then SIGKILL, losing buffered flow state.
    init: true
    stop_grace_period: 15s

    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5

    # Without this, a crash-looping recorder fills the host disk through json-file
    # logs — on a host that is also running a Bitcoin node.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Must assert that rows are advancing, not merely that a PID exists: the cgroup
    # OOM killer can kill tcpdump while the container stays "running" and the parser
    # sits forever on an empty pipe. A healthcheck alone does not restart anything —
    # the healthcheck binary exits non-zero and the supervisor inside the image exits,
    # which `restart: unless-stopped` then acts on.
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Plain path form. The `- /tmp:size=...,noexec,...` short syntax is a Docker CLI
    # extension, not Compose Spec, and some parsers (including Portainer's stack
    # editor) reject it. /tmp is barely used here - SQLite runs with
    # temp_store=MEMORY - so the sizing and noexec flags are not worth the
    # portability cost.
    tmpfs:
      - /tmp

    volumes:
      - egress-data:/data

    environment:
      # 24h, to match the triage latency this tool exists to survive and the 24h
      # flow history the alerting firewall itself keeps.
      HISTORY_MINUTES: "1440"
      # Enforced on live bytes — (page_count - freelist_count) * page_size — never
      # on the file size. DELETE does not shrink a SQLite file.
      MAX_DB_MB: "64"
      # How often kernel drop counters are sampled from tcpdump via SIGUSR1.
      CAPSTAT_INTERVAL_SECONDS: "10"

  # ---------------------------------------------------------------------------
  # Firewalla alarm agent - OPTIONAL. Delete this service if you only want the
  # recorder. It does nothing until MSP_DOMAIN and MSP_TOKEN are set.
  #
  # Deliberately a SEPARATE container from the recorder. This one holds API
  # credentials; the recorder holds none but has NET_RAW and the host network
  # namespace. Merging them would put credentials in the one container that can
  # inject packets on your LAN.
  # ---------------------------------------------------------------------------
  alarm-agent:
    image: ghcr.io/douglasring/umbrel-egress-recorder@sha256:e8ae9c39adc9c0da304410b9ba4d255e5475c747cf0744c6d9ecf4144eeabcde
    container_name: umbrel-alarm-agent
    entrypoint: ["python3", "-m", "agent"]
    restart: unless-stopped
    depends_on:
      - egress-recorder

    # No capabilities and NO host networking: this container only needs outbound
    # HTTPS. It reaches the recorder through a read-only volume, not the network.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    init: true
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    tmpfs:
      - /tmp

    volumes:
      # Read-only: the agent must never be able to alter the evidence it reads.
      - egress-data:/data:ro
      - agent-state:/state

    environment:
      # NO credentials here, and no ${...} substitution.
      #
      # Portainer stack environment variables did not survive a pull-and-redeploy on
      # this deployment, and compose substitution was not applying them reliably in a
      # Git-backed stack. Either way the agent would silently lose its configuration
      # on an update, which is the worst possible failure for a thing you only check
      # after an incident.
      #
      # Credentials live in /state/agent.env instead - the agent's own named volume,
      # which persists across redeploys, stack edits and image changes, and is never
      # in this public repository. Write it once from the container console:
      #
      #   cat > /state/agent.env <<'END'
      #   MSP_DOMAIN=your.msp.host
      #   MSP_TOKEN=your-token
      #   NTFY_TOPIC=your-private-topic
      #   END
      #
      # The agent waits for that file rather than exiting, so the container stays up
      # and its console stays reachable while you do it.
      POLL_SECONDS: "60"
      ALARM_TYPES: "1"
      ONLY_WITH_MATCH: "false"
      HISTORY_MINUTES: "1440"
      NOTIFY: "ntfy"
      NTFY_SERVER: "https://ntfy.sh"
      LLM: "none"

volumes:volumes:
  egress-data:
  agent-state:
