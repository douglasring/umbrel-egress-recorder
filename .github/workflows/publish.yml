name: Publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only, and no SBOM/provenance generation.
      #
      # Both were costing far more than they were worth here: the arm64 half is built
      # under QEMU emulation and ran for 40+ minutes on a cache miss, and the extra
      # attestation passes added minutes more. A build that cannot ship a one-line fix
      # to a node that is down is not a useful build. A cached multi-arch build took
      # 1m34s; a cold one never finished.
      #
      # TODO: restore arm64 (Raspberry Pi) on a native runner or a nightly schedule,
      # and re-add provenance there, rather than on the path of every release.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Print the digest to pin
        run: echo "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
