name: Publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Minimal grants. `attestations` and `id-token` exist only for build provenance.
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Umbrel runs on both Raspberry Pi (arm64) and x86_64 hardware.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          provenance: true
          sbom: true

      # Lets an operator verify the digest they pin actually came from this repo:
      #   gh attestation verify oci://ghcr.io/<repo>@<digest> --repo <repo>
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Print the digest to pin
        run: |
          echo "Pin this in your Portainer stack:"
          echo "  ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
